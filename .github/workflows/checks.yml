name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Install build tool
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-build.txt
      - name: Build portable package
        if: matrix.python == '3.12'
        run: python build_public.py
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: instance-hub-windows
          path: |
            dist/public/instance-hub-1.4.0-windows.zip
            dist/public/release-manifest.json
          if-no-files-found: error
          retention-days: 14
